services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: stage7-chromadb
    ports:
      - "8000:8000"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: stage7-backend
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - chromadb

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile.chatbot
    container_name: stage7-chatbot
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      - backend
